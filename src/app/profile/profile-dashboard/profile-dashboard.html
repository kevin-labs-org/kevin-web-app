<div>
  <div class="border-b">
    <div class="max-w-6xl mx-auto">
      <div class="px-4 sm:px-6">
        <div class="flex gap-4">
          <img [ngSrc]="ddragonService.getProfileIconUrl('1')" width="96" height="96" alt="Profile Icon" />
          <div class="flex flex-col">
            <h1 class="text-2xl font-semibold leading-none">
              {{ profile()?.name }}
              <span>#</span>
              <span>{{ profile()?.tag }}</span>
            </h1>
            <div class="flex">
              <button
                (click)="this.refreshProfile()"
                [zLoading]="shouldDisableRefresh()"
                [zDisabled]="shouldDisableRefresh()"
                z-button
                zType="outline"
              >
                Update
              </button>
            </div>
          </div>
        </div>

        <div class="flex">
          <a routerLink="overview" class="p-6" routerLinkActive="border-b">
            Overview
          </a>
          <a routerLink="champions" class="p-6" routerLinkActive="border-b">
            Matches
          </a>
        </div>
      </div>
    </div>
  </div>

  <router-outlet />
</div>

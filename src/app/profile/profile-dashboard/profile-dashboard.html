<div class="max-w-4xl p-6 mx-auto">
  <div class="flex p-6">
    <img ngSrc="a" width="100" height="100" alt="Profile Icon" />
    <div class="flex flex-col">
      <h1>
        {{ profile()?.name }}
        <span>#</span>
        <span>{{ profile()?.tag }}</span>
      </h1>
      <div class="flex">
        <button
          (click)="this.refreshProfile()"
          [zLoading]="shouldDisableRefresh()"
          [zDisabled]="shouldDisableRefresh()"
          z-button
          zType="outline"
        >
          Update
        </button>
      </div>
    </div>
  </div>

  <div class="flex">
    <a routerLink="overview" class="p-6" routerLinkActive="border-b">
      Overview
    </a>
    <a routerLink="champions" class="p-6"  routerLinkActive="border-b">
      Matches
    </a>
  </div>

  <router-outlet />
</div>
